[package]
name = "rules"
version = "0.1.0"
edition = "2021"
description = "Standalone static-analysis rules for BridgeWise's Solidity bridge contracts (starting with B001: cross-chain hash chain-ID enforcement)."

[dependencies]
solang-parser = "0.3.5"

[lib]
name = "rules"
path = "src/lib.rs"

[[bin]]
name = "rules"
path = "src/main.rs"
